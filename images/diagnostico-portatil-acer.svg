<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#F4F7F2"/>
  <circle cx="250" cy="640" r="240" fill="#EBF3E3"/>
  <polygon points="1200,0 1200,500 1000,0" fill="#eaf1fb" opacity="0.6"/>
  <!-- laptop, open, angled -->
  <g>
    <rect x="440" y="260" width="340" height="200" rx="10" fill="#141C24"/>
    <rect x="458" y="276" width="304" height="168" rx="4" fill="#0F4C90"/>
    <path d="M500 300 h60 v24 h40" fill="none" stroke="#7CB93E" stroke-width="6" stroke-linecap="round"/>
    <circle cx="600" cy="324" r="7" fill="#7CB93E"/>
    <circle cx="640" cy="324" r="7" fill="#93D14E"/>
    <polygon points="400,460 820,460 800,478 420,478" fill="#1b2420"/>
    <rect x="580" y="478" width="80" height="26" fill="#141C24"/>
  </g>
  <!-- magnifier -->
  <g transform="translate(700,470)">
    <circle cx="0" cy="0" r="80" fill="#ffffff" fill-opacity="0.5" stroke="#0F4C90" stroke-width="14"/>
    <line x1="55" y1="55" x2="130" y2="130" stroke="#0F4C90" stroke-width="20" stroke-linecap="round"/>
  </g>
  <!-- gauge -->
  <g transform="translate(950,260)">
    <circle cx="0" cy="0" r="60" fill="#ffffff" stroke="#141C24" stroke-width="6"/>
    <path d="M0 0 L28 -32" stroke="#5C9128" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="6" fill="#141C24"/>
  </g>
  <text x="600" y="700" font-family="Arial, sans-serif" font-size="34" fill="#57646F" text-anchor="middle">Diagnóstico gratuito</text>
</svg>
