<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#F4F7F2"/>
  <circle cx="960" cy="150" r="220" fill="#EBF3E3"/>
  <polygon points="1200,0 1200,800 1040,800 1160,0" fill="#eaf1fb" opacity="0.6"/>
  <rect x="180" y="540" width="840" height="18" rx="4" fill="#dbe3d8"/>
  <!-- laptop -->
  <g>
    <rect x="430" y="330" width="340" height="210" rx="10" fill="#141C24"/>
    <rect x="448" y="346" width="304" height="178" rx="4" fill="#0F4C90"/>
    <rect x="470" y="368" width="120" height="10" rx="2" fill="#7CB93E"/>
    <rect x="470" y="388" width="200" height="8" rx="2" fill="#3a4a54"/>
    <rect x="470" y="404" width="160" height="8" rx="2" fill="#3a4a54"/>
    <polygon points="400,540 800,540 780,560 420,560" fill="#1b2420"/>
  </g>
  <!-- wrench -->
  <g transform="translate(800,420) rotate(18)">
    <rect x="0" y="0" width="140" height="26" rx="6" fill="#5C9128"/>
    <circle cx="150" cy="13" r="30" fill="none" stroke="#5C9128" stroke-width="22"/>
  </g>
  <!-- screwdriver -->
  <g transform="translate(330,470) rotate(-24)">
    <rect x="0" y="0" width="120" height="16" rx="4" fill="#57646F"/>
    <rect x="118" y="-6" width="34" height="28" rx="4" fill="#0F4C90"/>
  </g>
  <circle cx="330" cy="330" r="26" fill="none" stroke="#dbe3d8" stroke-width="10"/>
  <circle cx="880" cy="320" r="20" fill="none" stroke="#dbe3d8" stroke-width="8"/>
</svg>
